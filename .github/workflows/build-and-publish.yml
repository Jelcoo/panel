name: Build and Publish

on:
  workflow_call:
    inputs:
      image_tag:
        description: Primary image tag (e.g. nightly, next, or a release version)
        required: true
        type: string
      tag_latest:
        description: Also move the stable tags (latest, aio, heavy, heavy-aio)
        required: false
        type: boolean
        default: false
      tag_latest_pre:
        description: Also move the pre-release tags (latest-pre, aio-pre, ...)
        required: false
        type: boolean
        default: false
      wings_channel:
        description: Wings build to embed in AIO binaries and images (nightly or release)
        required: true
        type: string
      windows:
        description: Also build the Windows binary
        required: false
        type: boolean
        default: false

env:
  BIN_NAME: panel-rs
  AIO_BIN_NAME: panel-rs-aio
  PROJECT_NAME: panel-rs
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/${{ github.repository }}

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Build frontend
        run: |
          cd frontend
          pnpm build:ci

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/dist/

  dist:
    name: Dist
    needs: [build-frontend]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build:
          - x86_64-linux
          - aarch64-linux
          - riscv64-linux
          - ppc64le-linux
          - x86_64-windows
        exclude:
          - build: ${{ !inputs.windows && 'x86_64-windows' || 'none' }}
        include:
          - build: x86_64-linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary_suffix: ""
            wings_platform: linux/amd64
          - build: aarch64-linux
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            binary_suffix: ""
            wings_platform: linux/arm64
          - build: riscv64-linux
            os: ubuntu-24.04
            target: riscv64gc-unknown-linux-musl
            binary_suffix: ""
            wings_platform: linux/riscv64
          - build: ppc64le-linux
            os: ubuntu-24.04
            target: powerpc64le-unknown-linux-musl
            binary_suffix: ""
            wings_platform: linux/ppc64le
          - build: x86_64-windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_suffix: ".exe"

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/dist/

      - name: Install Windows extra tools
        if: runner.os == 'Windows'
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Install cross
        if: contains(matrix.target, 'linux')
        env:
          CARGO_BUILD_WARNINGS: allow
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked

      - name: Extract wings binary
        if: contains(matrix.target, 'linux')
        env:
          WINGS_IMAGE: ghcr.io/calagopus/wings:${{ inputs.wings_channel == 'nightly' && 'nightly' || 'latest' }}
        run: |
          mkdir -p bins/all-in-one/bins
          docker pull --platform ${{ matrix.wings_platform }} "$WINGS_IMAGE"
          cid=$(docker create --platform ${{ matrix.wings_platform }} "$WINGS_IMAGE")
          docker cp "$cid:/usr/bin/calagopus-wings" bins/all-in-one/bins/wings-${{ inputs.wings_channel }}-bin
          docker rm "$cid"
          chmod +x bins/all-in-one/bins/wings-${{ inputs.wings_channel }}-bin

      - name: Build release binaries (Linux)
        if: contains(matrix.target, 'linux')
        env:
          WINGS_RELEASE: ${{ inputs.wings_channel == 'nightly' && 'nightly' || github.ref_name }}
          WINGS_BINARY_PATH: bins/wings-${{ inputs.wings_channel }}-bin
          # riscv64gc musl is not crt-static by default
          # opt-level=z enables LLVM's MachineOutliner on aarch64/riscv64; its whole-module
          # suffix tree under fat LTO + codegen-units=1 OOMs the 16GB runner.
          RUSTFLAGS: "-C target-feature=+crt-static -C llvm-args=-enable-machine-outliner=never"
        run: |
          cross build --release --target ${{ matrix.target }} -p $BIN_NAME
          cross build --release --target ${{ matrix.target }} -p $AIO_BIN_NAME

      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        env:
          # vendored openssl ships no ossl_static.pdb, so link.exe floods LNK4099
          RUSTFLAGS: "-A linker_messages"
        run: cargo build --release --target ${{ matrix.target }} -p $env:BIN_NAME

      - name: Prepare binaries (Linux)
        if: contains(matrix.target, 'linux')
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$BIN_NAME${{ matrix.binary_suffix }}" "dist/$BIN_NAME-${{ matrix.build }}"
          cp "target/${{ matrix.target }}/release/$AIO_BIN_NAME${{ matrix.binary_suffix }}" "dist/$AIO_BIN_NAME-${{ matrix.build }}"

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target\${{ matrix.target }}\release\$env:BIN_NAME${{ matrix.binary_suffix }}" "dist\$env:BIN_NAME-${{ matrix.build }}${{ matrix.binary_suffix }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.build }}
          path: dist/*${{ matrix.binary_suffix }}

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-source.cyclonedx.json
          artifact-name: sbom-source.cyclonedx.json
          upload-artifact: true

  create-multiarch-images:
    name: Create multi-arch ${{ matrix.variant }} Docker image
    needs: [dist, generate-sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: main
            dockerfile: Dockerfile
            tag_variant: ""
            stable_tag: latest
          - variant: aio
            dockerfile: Dockerfile.aio
            tag_variant: aio
            stable_tag: aio

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download source SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-source.cyclonedx.json
          path: sbom

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.PROJECT_NAME }}-*
          path: dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare binaries
        run: |
          for pair in x86_64:amd64 aarch64:arm64 riscv64:riscv64 ppc64le:ppc64le; do
            build="${pair%%:*}-linux"
            arch="${pair#*:}"
            mkdir -p ".docker/$arch"
            for bin in "$BIN_NAME" "$AIO_BIN_NAME"; do
              cp "dist/$PROJECT_NAME-$build/$bin-$build" ".docker/$arch/$bin"
            done
          done

          chmod +x .docker/*/*

      - name: Determine tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          TAG_VARIANT: ${{ matrix.tag_variant }}
          STABLE_TAG: ${{ matrix.stable_tag }}
          TAG_LATEST: ${{ inputs.tag_latest }}
          TAG_LATEST_PRE: ${{ inputs.tag_latest_pre }}
        run: |
          SUFFIXES=("${IMAGE_TAG}${TAG_VARIANT:+-$TAG_VARIANT}")
          [[ "$TAG_LATEST_PRE" == "true" ]] && SUFFIXES+=("${STABLE_TAG}-pre")
          [[ "$TAG_LATEST" == "true" ]] && SUFFIXES+=("$STABLE_TAG")

          IMAGE_TAGS=""
          for t in "${SUFFIXES[@]}"; do
            IMAGE_TAGS="${IMAGE_TAGS}${IMAGE_TAGS:+,}${GHCR_IMAGE}:${t},${DOCKERHUB_IMAGE}:${t}"
          done
          echo "IMAGE_TAGS=$IMAGE_TAGS" >> $GITHUB_ENV

      - name: Build & push multi-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64,linux/riscv64,linux/ppc64le
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          sbom: true
          provenance: true

      - name: Attach source SBOM attestation to image (GHCR)
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom/sbom-source.cyclonedx.json
          push-to-registry: true

      - name: Attach source SBOM attestation to image (Docker Hub)
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom/sbom-source.cyclonedx.json
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image with cosign
        run: |
          cosign sign --yes ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          cosign sign --yes ${{ env.DOCKERHUB_IMAGE }}@${{ steps.build.outputs.digest }}

  build-heavy-images:
    name: Build ${{ matrix.variant }} Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        variant: [heavy, heavy-aio]
        arch: [amd64, arm64]
        include:
          - variant: heavy
            dockerfile: Dockerfile.heavy
          - variant: heavy-aio
            dockerfile: Dockerfile.heavy.aio
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          # Only Dockerfile.heavy.aio declares WINGS_SOURCE; buildx ignores it elsewhere.
          build-args: WINGS_SOURCE=${{ inputs.wings_channel }}
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ inputs.image_tag }}-${{ matrix.variant }}-${{ matrix.arch }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ inputs.image_tag }}-${{ matrix.variant }}-${{ matrix.arch }}
          sbom: scan-stages=true
          provenance: true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}

  merge-heavy-images:
    name: Merge ${{ matrix.variant }} Docker manifest
    needs: [build-heavy-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: [heavy, heavy-aio]

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Create, push and sign multi-arch manifests
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          VARIANT: ${{ matrix.variant }}
          TAG_LATEST: ${{ inputs.tag_latest }}
          TAG_LATEST_PRE: ${{ inputs.tag_latest_pre }}
        run: |
          SUFFIXES=("${IMAGE_TAG}-${VARIANT}")
          [[ "$TAG_LATEST_PRE" == "true" ]] && SUFFIXES+=("${VARIANT}-pre")
          [[ "$TAG_LATEST" == "true" ]] && SUFFIXES+=("$VARIANT")

          for IMAGE in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            for t in "${SUFFIXES[@]}"; do
              docker buildx imagetools create -t "$IMAGE:$t" \
                "$IMAGE:${IMAGE_TAG}-${VARIANT}-amd64" \
                "$IMAGE:${IMAGE_TAG}-${VARIANT}-arm64"
            done
            cosign sign --yes "$IMAGE:${SUFFIXES[0]}"
          done
